# Render Blueprint: builds the game into one static file and serves it at wormsimulator.com.
# Students only ever load wormsimulator.com (Render's CDN); GitHub is only where Render pulls the code from.
# The root (/) is the build of main, Matt's preview. Each frozen version in releases/vN/ is copied
# into dist/ after the build and served at /vN/ (and /vN: Render serves a folder's index.html at
# both, and a route never overrides a file that exists, so no redirect is needed).
services:
  - type: web
    name: wormsimulator
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build && node scripts/copy-releases.mjs
    staticPublishPath: ./dist
    domains:
      # Render adds www.wormsimulator.com automatically and redirects it here.
      - wormsimulator.com
    routes:
      # Burrow Board (burrow-board/) runs as its own service below. wormsimulator.com/burrow/… is
      # passed through to it, so students only ever see wormsimulator.com. If Render gave the
      # service a different .onrender.com address, change these two lines to match it.
      - type: rewrite
        source: /burrow
        destination: https://burrow-board.onrender.com/burrow/
      - type: rewrite
        source: /burrow/*
        destination: https://burrow-board.onrender.com/burrow/*
    headers:
      # Revalidate on every load so a fix reaches every classroom right away (the file is ~190 kB gzipped).
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # Burrow Board: the idea-sharing app students use each round (burrow-board/README.md). A small
  # Node server that keeps every board in one SQLite file on a 1 GB disk. A paid plan, because free
  # services can't have a disk and fall asleep: Starter ($7/month) plus the disk ($0.25/month).
  - type: web
    name: burrow-board
    runtime: node
    plan: starter
    branch: main
    # The page reuses the game's lesson facts in src/content, so it builds from the repo root.
    buildCommand: cd burrow-board && npm ci --include=dev && npm run build
    startCommand: cd burrow-board && npm start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - burrow-board/**
        - src/content/**
    disk:
      name: burrow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Set in the Render Dashboard, never in this public repo.
      - key: TEACHER_PASSWORD
        sync: false
